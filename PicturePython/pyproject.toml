[project]
name = "picture-python"
version = "0.1.0"
description = "Python implementation of the Computervision service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dapr>=1.14.0",
    "dapr-ext-grpc>=1.14.0",
    "azure-cognitiveservices-vision-computervision>=0.9.0",
    "msrest>=0.7.1",
    "cloudevents>=1.11.0",
    "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
