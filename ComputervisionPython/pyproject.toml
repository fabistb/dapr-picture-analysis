[project]
name = "computervision-python"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "azure-cognitiveservices-vision-computervision>=0.9.1",
    "dapr>=1.18.3",
    "dapr-ext-fastapi>=1.18.3",
    "fastapi>=0.143.3",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
